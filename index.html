<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>120 Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1f2e;
  --surface: #252b3b;
  --surface2: #2f3650;
  --border: rgba(255,255,255,0.08);
  --text: #f0f4ff;
  --text-muted: #8892b0;
  --accent: #64ffda;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
  user-select: none;
  overflow: hidden;
}

/* GRID */
#grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 3px;
  flex: 1;
  min-height: 0;
}
#grid.up { transform: scaleY(-1); }
#grid.up .cell { transform: scaleY(-1); }
#grid.up .cell:hover { transform: scaleY(-1) scale(1.07); }
#grid.up .cell:active { transform: scaleY(-1) scale(0.94); }

.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Nunito', sans-serif;
  font-size: clamp(10px, 1.8vw, 22px);
  font-weight: 800;
  border-radius: 7px;
  border: 2px solid rgba(255,255,255,0.1);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: transform 0.1s, border-color 0.12s, background 0.12s;
  position: relative;
  overflow: hidden;
}
.cell:hover { transform: scale(1.07); border-color: rgba(255,255,255,0.3); }
.cell:active { transform: scale(0.94); }
.cell.hidden {
  background: var(--bg) !important;
  border: 2px dashed rgba(255,255,255,0.12) !important;
  color: transparent !important;
}
.cell.hidden .num { opacity: 0; }
.cell.start-num { outline: 3px solid var(--accent); outline-offset: -3px; }

/* TOOLBAR */
#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  background: var(--surface);
  border-radius: 12px;
  padding: 9px 12px;
  border: 1px solid var(--border);
}
.lbl {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-weight: 700;
}
.div { width: 1px; height: 30px; background: var(--border); margin: 0 2px; flex-shrink: 0; }

/* Swatches */
.swatch {
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform 0.1s, border-color 0.12s;
  flex-shrink: 0;
}
.swatch:hover { transform: scale(1.18); }
.swatch.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
.swatch[data-col="erase"] { border-color: rgba(255,255,255,0.2); }

/* Buttons */
.btn {
  padding: 6px 12px;
  border-radius: 7px;
  border: 1.5px solid rgba(255,255,255,0.14);
  background: var(--surface2);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.1s, transform 0.08s, border-color 0.1s;
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.28); }
.btn:active { transform: scale(0.95); }
.btn.danger  { border-color: rgba(239,71,111,0.4); color: #ef476f; }
.btn.danger:hover { background: rgba(239,71,111,0.14); border-color: #ef476f; }
.btn.accent  { border-color: rgba(100,255,218,0.3); color: var(--accent); }
.btn.accent:hover { background: rgba(100,255,218,0.1); }
.btn.on { border-color: var(--accent); color: var(--accent); background: rgba(100,255,218,0.08); }
.btn.awaiting-start { animation: awaitPulse 1.1s ease-in-out infinite; }
@keyframes awaitPulse {
  0%,100% { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(100,255,218,0.35); }
  50% { border-color: rgba(100,255,218,0.55); box-shadow: 0 0 0 3px rgba(100,255,218,0.15); }
}

/* Popup menus */
.popup-wrap { position: relative; }
.popup {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  background: var(--surface2);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 11px;
  padding: 9px;
  gap: 5px;
  flex-wrap: wrap;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  min-width: 160px;
}
.popup.open { display: flex; }
.popup-label {
  width: 100%;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 2px;
}
.pnum {
  width: 32px; height: 32px;
  border-radius: 6px;
  border: 1.5px solid rgba(255,255,255,0.14);
  background: var(--surface);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, border-color 0.1s, transform 0.08s;
}
.pnum:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); transform: scale(1.1); }
.pnum:active { transform: scale(0.92); }

/* TIMER PANEL */
#timer-panel {
  display: none;
  background: var(--surface);
  border-radius: 12px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
#timer-panel.open { display: flex; }

#timer-display {
  font-family: 'Nunito', sans-serif;
  font-size: 38px;
  font-weight: 900;
  min-width: 100px;
  text-align: center;
  letter-spacing: 0.04em;
  color: var(--accent);
  transition: color 0.3s;
}
#timer-display.warning { color: #ffd166; }
#timer-display.danger  { color: #ef476f; }

.tctrls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

input[type=range] {
  -webkit-appearance: none;
  height: 4px; border-radius: 2px;
  background: var(--surface2);
  outline: none; cursor: pointer; width: 110px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
}

/* Score */
#score-area {
  display: flex; align-items: center; gap: 8px; margin-left: auto;
}
#score-val {
  font-family: 'Nunito', sans-serif;
  font-size: 24px; font-weight: 900;
  color: var(--accent);
  min-width: 40px; text-align: center;
}

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.28);
  transform: scale(0);
  animation: rpl 0.34s linear;
  pointer-events: none;
}
@keyframes rpl { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>

<div id="grid"></div>

<!-- MAIN TOOLBAR -->
<div id="toolbar">

  <span class="lbl">Colour</span>
  <div id="colours" style="display:flex;gap:6px;align-items:center">
    <div class="swatch selected" data-col="erase" style="background:#4a5068" title="Erase / hide"></div>
    <div class="swatch" data-col="#ffd166" style="background:#ffd166" title="Yellow"></div>
    <div class="swatch" data-col="#06d6a0" style="background:#06d6a0" title="Green"></div>
    <div class="swatch" data-col="#118ab2" style="background:#118ab2" title="Blue"></div>
    <div class="swatch" data-col="#ef476f" style="background:#ef476f" title="Red"></div>
  </div>

  <div class="div"></div>
  <span class="lbl">Hide</span>

  <div class="popup-wrap" id="rand-wrap">
    <button class="btn" onclick="togglePopup('rand')">Random ▾</button>
    <div class="popup" id="rand-popup">
      <div class="popup-label">Hide how many?</div>
    </div>
  </div>

  <button class="btn" id="hide-2" onclick="hideEvery(2)">2s</button>
  <button class="btn" id="hide-3" onclick="hideEvery(3)">3s</button>
  <button class="btn" id="hide-5" onclick="hideEvery(5)">5s</button>
  <button class="btn" id="hide-10" onclick="hideEvery(10)">10s</button>
  <button class="btn" onclick="hideAll()">All</button>
  <button class="btn" id="choose-start-btn" onclick="toggleChooseStart()" title="Pick a number to start counting from">Choose start</button>

  <div class="div"></div>
  <span class="lbl">Tools</span>

  <div class="popup-wrap" id="hl-wrap">
    <button class="btn" onclick="togglePopup('hl')">Highlight ▾</button>
    <div class="popup" id="hl-popup">
      <div class="popup-label">Quick colour</div>
      <button class="btn" id="hl-2" style="font-size:11px;width:100%" onclick="paintEvery(2,'#ffd166');closePopups()">Every 2nd — yellow</button>
      <button class="btn" id="hl-3" style="font-size:11px;width:100%" onclick="paintEvery(3,'#06d6a0');closePopups()">Every 3rd — green</button>
      <button class="btn" id="hl-5" style="font-size:11px;width:100%" onclick="paintEvery(5,'#118ab2');closePopups()">Every 5th — blue</button>
      <button class="btn" id="hl-10" style="font-size:11px;width:100%" onclick="paintEvery(10,'#ef476f');closePopups()">Every 10th — red</button>
      <button class="btn" style="font-size:11px;width:100%" onclick="paintOddEven();closePopups()">Odd / Even split</button>
    </div>
  </div>

  <button class="btn accent" id="dir-btn" onclick="toggleDir()">⬇ Down</button>
  <button class="btn" id="timer-toggle-btn" onclick="toggleTimerPanel()">⏱ Timer</button>

  <div class="div"></div>

  <div id="score-area">
    <div>
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);font-weight:700">Score</div>
      <div id="score-val">0</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px">
      <button class="btn" style="padding:2px 9px;font-size:13px;line-height:1" onclick="chgScore(1)">+</button>
      <button class="btn" style="padding:2px 9px;font-size:13px;line-height:1" onclick="chgScore(-1)">−</button>
    </div>
    <button class="btn" style="padding:3px 8px;font-size:11px;color:var(--text-muted)" onclick="resetScore()" title="Reset score">↺</button>
  </div>

  <div class="div"></div>
  <button class="btn danger" onclick="clearAll()">✕ Clear</button>
</div>

<!-- TIMER PANEL -->
<div id="timer-panel">
  <div id="timer-display">1:00</div>

  <div class="tctrls">
    <span class="lbl">Mode</span>
    <button class="btn" id="mode-btn" onclick="toggleTimerMode()">Count down</button>
  </div>

  <div class="tctrls">
    <span class="lbl">Time</span>
    <input type="range" id="tslider" min="10" max="300" step="10" value="60" oninput="onSlider()">
    <span id="tslider-lbl" style="font-size:12px;font-weight:700;min-width:36px">1:00</span>
  </div>

  <div class="tctrls">
    <button class="btn accent" id="start-btn" onclick="startTimer()">▶ Start</button>
    <button class="btn" onclick="pauseTimer()">⏸ Pause</button>
    <button class="btn" onclick="resetTimer()">↺ Reset</button>
  </div>
</div>

<script>
/* STATE */
let selectedCol = 'erase';
let dirDown = true;
const cellColours = new Array(121).fill(null);
const cellHidden  = new Array(121).fill(false);
let score = 0;

/* CHOOSE START */
let chooseStartActive = false;   // true from the moment "Choose start" is toggled on until it's consumed/cancelled
let customStart = null;          // the number the user picked to count from, once chosen
const INTERVAL_BTN_IDS = ['hide-2','hide-3','hide-5','hide-10','hl-2','hl-3','hl-5','hl-10'];

/* AUDIO */
const ac = new (window.AudioContext || window.webkitAudioContext)();
function resume() { if (ac.state==='suspended') ac.resume(); }

function beep(freq=440, dur=0.08, type='sine', vol=0.15) {
  const o=ac.createOscillator(), g=ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.frequency.value=freq; o.type=type;
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.start(); o.stop(ac.currentTime+dur);
}

const SCALE=[261,294,330,370,392,440,494,523,587,659];
function cellSound(n) { beep(SCALE[(n-1)%10], 0.09,'sine',0.14); }

function uiSound(t) {
  if (t==='select')  beep(900,0.05,'sine',0.1);
  if (t==='hide')    beep(260,0.1,'triangle',0.1);
  if (t==='reveal')  beep(620,0.09,'sine',0.13);
  if (t==='clear')  { beep(340,0.09,'triangle',0.1); setTimeout(()=>beep(210,0.12,'triangle',0.08),90); }
  if (t==='dir')    { beep(480,0.06,'sine',0.1); setTimeout(()=>beep(640,0.06,'sine',0.1),60); }
  if (t==='expand')  beep(700,0.05,'sine',0.08);
  if (t==='score+')  beep(880,0.07,'sine',0.12);
  if (t==='score-')  beep(330,0.07,'sine',0.1);
  if (t==='alarm')  { [0,160,320,480].forEach(d=>setTimeout(()=>beep(880,0.13,'square',0.22),d)); }
  if (t==='tick')    beep(550,0.04,'sine',0.09);
  if (t==='paint')   beep(520,0.07,'sine',0.11);
}

/* GRID HELPERS */
function luma(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000;
}
function textFor(bg) { return luma(bg)>145 ? '#111827' : '#ffffff'; }

function applyCell(cell, n) {
  const col=cellColours[n];
  if (col) {
    cell.style.background=col;
    cell.style.borderColor=col;
    cell.style.color=textFor(col);
  } else {
    cell.style.background='';
    cell.style.borderColor='';
    cell.style.color='';
  }
  if (cellHidden[n]) { cell.classList.add('hidden'); }
  else               { cell.classList.remove('hidden'); }
}

function addRipple(cell, e) {
  const rect=cell.getBoundingClientRect();
  const r=document.createElement('span');
  r.className='ripple';
  const sz=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${sz}px;height:${sz}px;left:${(e.clientX||rect.left+rect.width/2)-rect.left-sz/2}px;top:${(e.clientY||rect.top+rect.height/2)-rect.top-sz/2}px`;
  cell.appendChild(r);
  r.addEventListener('animationend',()=>r.remove());
}

function buildGrid() {
  const g=document.getElementById('grid');
  g.innerHTML='';
  g.className=dirDown?'':'up';
  for (let i=1;i<=120;i++) {
    const n=i;
    const cell=document.createElement('div');
    cell.className='cell';
    applyCell(cell,n);
    const span=document.createElement('span');
    span.className='num'; span.textContent=n;
    cell.appendChild(span);
    cell.addEventListener('click',e=>{
      resume();

      if (chooseStartActive && customStart===null) {
        addRipple(cell,e);
        customStart=n;
        cell.classList.add('start-num');
        uiSound('select');
        setIntervalBtnsAwaiting(true);
        return;
      }

      addRipple(cell,e);

      if (cellHidden[n]) {
        // Always reveal hidden cells on tap
        cellHidden[n]=false;
        applyCell(cell,n);
        uiSound('reveal');
        return;
      }

      if (selectedCol==='erase') {
        // Erase tool: remove colour if coloured, otherwise hide
        if (cellColours[n]) {
          cellColours[n]=null;
          applyCell(cell,n);
          cellSound(n);
        } else {
          cellHidden[n]=true;
          applyCell(cell,n);
          uiSound('hide');
        }
      } else {
        // Colour tool: toggle colour, or hide if same colour already applied
        if (cellColours[n]===selectedCol) {
          cellColours[n]=null;
        } else {
          cellColours[n]=selectedCol;
        }
        applyCell(cell,n);
        cellSound(n);
      }
    });
    g.appendChild(cell);
  }
}

/* SWATCHES */
document.querySelectorAll('.swatch').forEach(s=>{
  s.addEventListener('click',()=>{
    resume();
    document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));
    s.classList.add('selected');
    selectedCol=s.dataset.col;
    uiSound('select');
  });
});

/* POPUPS */
let openPopup=null;
const popupIds={rand:'rand-popup', hl:'hl-popup'};

function togglePopup(key) {
  resume();
  const wasOpen=(openPopup===key);
  closePopups();
  if (!wasOpen) {
    document.getElementById(popupIds[key]).classList.add('open');
    openPopup=key;
    uiSound('expand');
  }
}
function closePopups() {
  Object.values(popupIds).forEach(id=>document.getElementById(id).classList.remove('open'));
  openPopup=null;
}
document.addEventListener('click',e=>{ if (!e.target.closest('.popup-wrap')) closePopups(); });

// Build random picker
const randPop=document.getElementById('rand-popup');
for (let i=1;i<=10;i++) {
  const b=document.createElement('div');
  b.className='pnum'; b.textContent=i;
  b.title=`Hide ${i} random number${i>1?'s':''}`;
  b.addEventListener('click',()=>{ resume(); hideRandom(i); closePopups(); });
  randPop.appendChild(b);
}

/* HIDE / REVEAL */
function hideEvery(n) {
  resume();
  let start=n, consumed=false;
  if (chooseStartActive && customStart!==null) { start=customStart; consumed=true; }
  const targets=[]; for (let i=start;i<=120;i+=n) targets.push(i);
  const anyVisible=targets.some(x=>!cellHidden[x]);
  targets.forEach(x=>{ cellHidden[x]=anyVisible; });
  buildGrid();
  uiSound(anyVisible?'hide':'reveal');
  if (consumed) finishChooseStart();
}

function hideAll() {
  resume();
  const anyVisible=Array.from({length:120},(_,i)=>i+1).some(x=>!cellHidden[x]);
  for (let i=1;i<=120;i++) cellHidden[i]=anyVisible;
  buildGrid();
  uiSound(anyVisible?'hide':'reveal');
}

function hideRandom(count) {
  resume();
  const vis=Array.from({length:120},(_,i)=>i+1).filter(x=>!cellHidden[x]);
  vis.sort(()=>Math.random()-0.5);
  vis.slice(0,count).forEach(x=>{ cellHidden[x]=true; });
  buildGrid();
  uiSound('hide');
}

/* CHOOSE START */
function toggleChooseStart() {
  resume();
  if (chooseStartActive) {
    cancelChooseStart();
  } else {
    chooseStartActive=true;
    customStart=null;
    document.getElementById('choose-start-btn').classList.add('on');
    uiSound('select');
  }
}

function cancelChooseStart() {
  chooseStartActive=false;
  customStart=null;
  document.getElementById('choose-start-btn').classList.remove('on');
  clearStartHighlight();
  setIntervalBtnsAwaiting(false);
}

function finishChooseStart() {
  // Called after a "from custom start" action is performed — feature turns itself off.
  chooseStartActive=false;
  customStart=null;
  document.getElementById('choose-start-btn').classList.remove('on');
  clearStartHighlight();
  setIntervalBtnsAwaiting(false);
}

function clearStartHighlight() {
  document.querySelectorAll('.cell.start-num').forEach(c=>c.classList.remove('start-num'));
}

function setIntervalBtnsAwaiting(on) {
  INTERVAL_BTN_IDS.forEach(id=>{
    const el=document.getElementById(id);
    if (el) el.classList.toggle('awaiting-start', on);
  });
}

/* HIGHLIGHT */
function paintEvery(n,col) {
  resume();
  let start=n, consumed=false;
  if (chooseStartActive && customStart!==null) { start=customStart; consumed=true; }
  for (let i=start;i<=120;i+=n) cellColours[i]=col;
  buildGrid(); uiSound('paint');
  if (consumed) finishChooseStart();
}

function paintOddEven() {
  resume();
  for (let i=1;i<=120;i++) cellColours[i]=i%2===0?'#118ab2':'#ffd166';
  buildGrid(); uiSound('paint');
}

/* DIRECTION */
function toggleDir() {
  resume();
  dirDown=!dirDown;
  document.getElementById('dir-btn').textContent=dirDown?'⬇ Down':'⬆ Up';
  document.getElementById('grid').className=dirDown?'':'up';
  uiSound('dir');
}

/* SCORE */
function chgScore(d) {
  resume();
  score=Math.max(0,score+d);
  document.getElementById('score-val').textContent=score;
  uiSound(d>0?'score+':'score-');
}
function resetScore() { score=0; document.getElementById('score-val').textContent=0; }

/* CLEAR */
function clearAll() {
  resume();
  cancelChooseStart();
  for (let i=1;i<=120;i++) { cellColours[i]=null; cellHidden[i]=false; }
  dirDown=true;
  document.getElementById('dir-btn').textContent='⬇ Down';
  document.getElementById('grid').className='';
  document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));
  document.querySelector('.swatch').classList.add('selected');
  selectedCol='erase';
  score=0; document.getElementById('score-val').textContent=0;
  buildGrid(); uiSound('clear');
}

/* TIMER */
let tMode='down', tDur=60, tElapsed=0, tRunning=false, tInt=null;

function fmt(s) {
  const m=Math.floor(Math.abs(s)/60), sec=Math.abs(s)%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  const disp=document.getElementById('timer-display');
  let val = tMode==='down' ? tDur-tElapsed : tElapsed;
  disp.textContent=fmt(val);
  disp.className='';
  if (tMode==='down') {
    if (val<=5)  disp.className='danger';
    else if (val<=15) disp.className='warning';
  }
}

function toggleTimerPanel() {
  resume();
  const p=document.getElementById('timer-panel');
  p.classList.toggle('open');
  document.getElementById('timer-toggle-btn').classList.toggle('on', p.classList.contains('open'));
  uiSound('expand');
}

function toggleTimerMode() {
  tMode=tMode==='down'?'up':'down';
  document.getElementById('mode-btn').textContent=tMode==='down'?'Count down':'Count up';
  resetTimer();
}

function onSlider() {
  tDur=parseInt(document.getElementById('tslider').value);
  document.getElementById('tslider-lbl').textContent=fmt(tDur);
  if (!tRunning) { tElapsed=0; updateTimerDisplay(); }
}

function startTimer() {
  resume();
  if (tRunning) return;
  tRunning=true;
  document.getElementById('start-btn').textContent='▶ Running';
  tInt=setInterval(()=>{
    tElapsed++;
    if (tMode==='down') {
      const rem=tDur-tElapsed;
      if (rem>0 && rem<=5) uiSound('tick');
      if (rem<=0) { tElapsed=tDur; updateTimerDisplay(); pauseTimer(); uiSound('alarm'); return; }
    }
    updateTimerDisplay();
  },1000);
}

function pauseTimer() {
  tRunning=false; clearInterval(tInt);
  document.getElementById('start-btn').textContent='▶ Start';
}

function resetTimer() {
  pauseTimer(); tElapsed=0; updateTimerDisplay();
}

/* INIT */
buildGrid();
updateTimerDisplay();
</script>
</body>
</html>
